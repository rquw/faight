<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>faight</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23161616'/><text x='50' y='72' font-size='64' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' fill='%23f2c12e'>f</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <h1 class="logo">f<span>aight</span></h1>
    <input id="name" maxlength="14" placeholder="Name" autocomplete="off" spellcheck="false">
    <button id="create" class="primary">Raum erstellen</button>
    <div class="row">
      <input id="code" maxlength="4" inputmode="numeric" placeholder="Code" autocomplete="off">
      <button id="join">Beitreten</button>
    </div>
    <p id="err"></p>
    <p class="mobile-hint">Handy quer halten · links laufen · rechts zielen &amp; schießen</p>
    <div class="keys">
      <span><b>A</b><b>D</b> laufen</span>
      <span><b>Space</b> springen</span>
      <span><b>S</b> ducken</span>
      <span><b>Maus</b> zielen · schießen</span>
      <span><b>Q</b> Waffe werfen</span>
    </div>
  </div>
</div>

<div id="rooms" hidden>
  <div class="panel">
    <div class="panel-head"><b>Aktive Räume</b><button id="rooms-close">Schließen</button></div>
    <div id="rooms-list"></div>
  </div>
</div>

<div id="hud" hidden>
  <div id="room">RAUM <b id="roomcode"></b><button id="copy" title="Link kopieren">Link</button></div>
  <div id="scores"></div>
  <button id="mute" title="Ton an/aus">Ton an</button>
</div>

<script src="client.js"></script>
</body>
</html>
