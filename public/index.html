<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>faight</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23161616'/><text x='50' y='72' font-size='64' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' fill='%23f2c12e'>f</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <h1 class="logo">f<span>aight</span></h1>
    <input id="name" maxlength="14" placeholder="Name" autocomplete="off" spellcheck="false">
    <button id="create" class="primary">Create room</button>
    <div class="row">
      <input id="code" maxlength="4" inputmode="numeric" placeholder="Code" autocomplete="off">
      <button id="join">Join</button>
    </div>
    <p id="err"></p>
    <p class="mobile-hint">Hold your phone sideways · left to move · right to aim &amp; shoot</p>
    <div class="keys">
      <span><b>A</b><b>D</b> move</span>
      <span><b>Space</b> jump</span>
      <span><b>S</b> crouch</span>
      <span><b>Mouse</b> aim · shoot</span>
      <span><b>Q</b> throw weapon</span>
    </div>
    <div id="version"></div>
  </div>
</div>

<div id="invite" hidden>
  <div class="card">
    <h1 class="logo">f<span>aight</span></h1>
    <p class="invite-sub">Joining room <b id="invite-code"></b></p>
    <input id="invite-name" maxlength="14" placeholder="Your name" autocomplete="off" spellcheck="false">
    <button id="invite-ok" class="primary">OK</button>
    <button id="invite-back">Back to menu</button>
  </div>
</div>

<div id="rooms" hidden>
  <div class="panel">
    <div class="panel-head"><b>Active rooms</b><button id="rooms-close">Close</button></div>
    <div id="rooms-list"></div>
  </div>
</div>

<div id="mappick" hidden>
  <div class="panel">
    <div class="panel-head"><b>Next map</b><button id="mappick-close">Close</button></div>
    <div id="mappick-list"></div>
  </div>
</div>

<div id="chatbar" hidden><input id="chatin" maxlength="80" placeholder="Message… (Enter to send, Esc to cancel)" autocomplete="off" spellcheck="false"></div>
<div id="chatlog"></div>

<div id="hud" hidden>
  <div id="room">ROOM <b id="roomcode"></b><button id="copy" title="Copy link">Link</button><button id="maps" title="Pick the next map (L)" hidden>Maps</button><div id="queued"></div><div id="ping"></div></div>
  <div id="scores"></div>
  <button id="mute" title="Sound on/off">Sound on</button>
</div>

<script src="protocol.js"></script>
<script src="client.js"></script>
</body>
</html>
